[package]
name = "hyperm"
version = "0.1.0"
edition = "2021"
description = "A lightweight PM2-style Firecracker microVM manager"
license = "MIT"
repository = "https://github.com/your-org/HyperM"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
